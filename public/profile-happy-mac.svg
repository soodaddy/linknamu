<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" shape-rendering="crispEdges" role="img" aria-label="해피 맥 프로필 사진">
  <rect width="20" height="20" fill="#bcd7f0" />
  <!-- 그림자 -->
  <rect x="4" y="18" width="12" height="1" fill="#000" opacity="0.15" />
  <!-- 본체 -->
  <rect x="3" y="17" width="14" height="1" fill="#000" />
  <rect x="4" y="2" width="12" height="15" fill="#000" />
  <rect x="5" y="3" width="10" height="13" fill="#d8d3c3" />
  <!-- 화면 -->
  <rect x="6" y="4" width="8" height="8" fill="#000" />
  <rect x="7" y="5" width="6" height="6" fill="#e6efdd" />
  <!-- 얼굴: 눈, 코, 웃는 입 -->
  <rect x="8" y="6" width="1" height="2" fill="#000" />
  <rect x="11" y="6" width="1" height="2" fill="#000" />
  <rect x="9" y="7" width="1" height="2" fill="#000" />
  <rect x="10" y="8" width="1" height="1" fill="#000" />
  <rect x="8" y="9" width="1" height="1" fill="#000" />
  <rect x="9" y="10" width="2" height="1" fill="#000" />
  <rect x="11" y="9" width="1" height="1" fill="#000" />
  <!-- 플로피 디스크 슬롯 -->
  <rect x="7" y="13" width="6" height="1" fill="#4a4740" />
</svg>
